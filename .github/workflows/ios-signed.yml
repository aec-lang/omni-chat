name: Build signed iOS app

on:
  workflow_dispatch:
    inputs:
      distribution:
        description: Distribution method matching the provisioning profile
        type: choice
        options:
          - app-store-connect
          - release-testing
        default: app-store-connect

permissions:
  contents: read

jobs:
  signed-ios:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
      KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
      EXPORT_METHOD: ${{ inputs.distribution }}
    steps:
      - uses: actions/checkout@v4
      - name: Check signing configuration
        run: |
          for secret_name in APPLE_TEAM_ID APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_PROVISION_PROFILE_BASE64 KEYCHAIN_PASSWORD; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::Missing signing secret: $secret_name. See docs/IOS.md."
              exit 1
            fi
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Create iOS project
        run: |
          npm run build:mobile
          npx cap add ios
          npx cap sync ios
          ruby scripts/configure-ios.rb
      - name: Install signing identity
        run: |
          umask 077
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/omnichat.p12"
          printf '%s' "$APPLE_PROVISION_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/omnichat.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/omnichat.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/omnichat.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/omnichat.keychain-db"
          security import "$RUNNER_TEMP/omnichat.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/omnichat.keychain-db"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/omnichat.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/omnichat.keychain-db" "$HOME/Library/Keychains/login.keychain-db"
          security cms -D -i "$RUNNER_TEMP/omnichat.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          python3 scripts/ios-export-options.py
      - name: Archive and export IPA
        run: |
          profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/OmniChat.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$profile_uuid" archive
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/OmniChat.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath ios-export
      - uses: actions/upload-artifact@v4
        with:
          name: OmniChat-iOS-Signed
          path: ios-export/*.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/omnichat.keychain-db" 2>/dev/null || true
          if [ -f "$RUNNER_TEMP/profile.plist" ]; then
            profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          fi
          rm -f "$RUNNER_TEMP/omnichat.p12" "$RUNNER_TEMP/omnichat.mobileprovision" "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP/ExportOptions.plist"
